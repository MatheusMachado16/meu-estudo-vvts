4" lengthAdjust="spacing" textLength="181" x="380" y="494.6241">SistemaValidacaoEvidencia</text><path d="M117,99.0679 L117,179.0679 L570,179.0679 L570,109.0679 L560,99.0679 L117,99.0679 " fill="#FAFAFA" style="stroke:#181818;stroke-width:0.5;"/><path d="M560,99.0679 L560,109.0679 L570,109.0679 L560,99.0679 " fill="#FAFAFA" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="178" x="123" y="117.9649">Objetivo do Teste de Estresse:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="366" x="123" y="135.6709">Verificar os limites de capacidade do sistema e observar como</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="432" x="123" y="153.377">ele se comporta sob uma carga muito al&#233;m do volume normal esperado.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="376" x="123" y="171.083">O foco &#233; avaliar se ocorre degrada&#231;&#227;o controlada ou falha total.</text><path d="M5,189.892 L5,269.892 L428,269.892 L428,199.892 L418,189.892 L5,189.892 " fill="#FAFAFA" style="stroke:#181818;stroke-width:0.5;"/><path d="M418,189.892 L418,199.892 L428,199.892 L418,189.892 " fill="#FAFAFA" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="402" x="11" y="208.789">O pico simulado representa o volume acumulado de v&#225;rios t&#233;cnicos</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="348" x="11" y="226.495">(ex: 50 t&#233;cnicos enviando aproximadamente 10 fotos cada,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="342" x="11" y="244.201">totalizando aproximadamente 500 requisi&#231;&#245;es) durante o</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="112" x="11" y="261.907">fechamento di&#225;rio.</text><path d="M147,282.716 L220,282.716 L220,292.4221 L210,302.4221 L147,302.4221 L147,282.716 " fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="83.118" style="stroke:#000000;stroke-width:1.5;" width="451" x="147" y="282.716"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="28" x="162" y="297.6131">loop</text><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="198" x="235" y="296.475">[500 requisi&#231;&#245;es em curto intervalo]</text><polygon fill="#181818" points="458.5,322.1281,468.5,326.1281,458.5,330.1281,462.5,326.1281" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="216.5" x2="464.5" y1="326.1281" y2="326.1281"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="230" x="223.5" y="320.3191">solicitarValidacao("foto_evidencia.jpg")</text><polygon fill="#181818" points="227.5,353.8341,217.5,357.8341,227.5,361.8341,223.5,357.8341" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="221.5" x2="469.5" y1="357.8341" y2="357.8341"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="118" x="233.5" y="352.0251">retornarResultado()</text><path d="M475,377.8341 L475,457.8341 L729,457.8341 L729,387.8341 L719,377.8341 L475,377.8341 " fill="#FAFAFA" style="stroke:#181818;stroke-width:0.5;"/><path d="M719,377.8341 L719,387.8341 L729,387.8341 L719,377.8341 " fill="#FAFAFA" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="163" x="481" y="396.7311">Comportamento esperado:</text><text fill="#000000" font-family="sans-serif" 