just="spacing" textLength="181" x="305" y="352.388">SistemaValidacaoEvidencia</text><rect fill="#FFFFFF" height="31.706" style="stroke:#181818;stroke-width:1.0;" width="10" x="390.5" y="281.716"/><path d="M5,99.0679 L5,179.0679 L514,179.0679 L514,109.0679 L504,99.0679 L5,99.0679 " fill="#FAFAFA" style="stroke:#181818;stroke-width:0.5;"/><path d="M504,99.0679 L504,109.0679 L514,109.0679 L504,99.0679 " fill="#FAFAFA" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="183" x="11" y="117.9649">Crit&#233;rio de Aceita&#231;&#227;o (Gherkin):</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="488" x="11" y="135.6709">Dado que existe uma fotografia leg&#237;vel de um cabo contendo a metragem 1493 m,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="382" x="11" y="153.377">quando o Supervisor de Campo solicita a valida&#231;&#227;o da evid&#234;ncia,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="482" x="11" y="171.083">ent&#227;o o sistema deve identificar 1493 m e apresentar a evid&#234;ncia como aprovada.</text><path d="M30,189.892 L30,252.892 L487,252.892 L487,199.892 L477,189.892 L30,189.892 " fill="#FAFAFA" style="stroke:#181818;stroke-width:0.5;"/><path d="M477,189.892 L477,199.892 L487,199.892 L477,189.892 " fill="#FAFAFA" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="320" x="55" y="208.789">UAT: valida&#231;&#227;o da necessidade do usu&#225;rio de neg&#243;cio,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="251" x="55" y="226.495">tratando o sistema como uma caixa preta.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="398" x="55" y="244.201">O foco est&#225; no resultado esperado, sem detalhes t&#233;cnicos internos.</text><polygon fill="#181818" points="378.5,277.716,388.5,281.716,378.5,285.716,382.5,281.716" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="122.5" x2="384.5" y1="281.716" y2="281.716"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="249" x="129.5" y="275.907">solicitarValidacao("foto_cabo_1493m.jpg")</text><polygon fill="#181818" points="133.5,309.4221,123.5,313.4221,133.5,317.4221,129.5,313.4221" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="127.5" x2="394.5" y1="313.4221" y2="313.4221"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="228" x="139.5" y="307.6131">exibirResultado("1493 m", "Aprovada")</text><!--SRC=[dPBFRXGn3CRlynJMdBRIjcg12tj0Mbh4aOe2ryfDlBE6IJnDCgDzdOe30eaJZp0lXht_M1KM96wH7N_vVP-JFt7iC660857SCaaWAAcdAkyxrvWAE-umbclqdcC3JyuF-YzbjQjVd5VeYYIuwJjA0sT9LtI9ePEg-wK2DvmB1Vo0BNjqAAy6zXGTOnMb4CX0Vr2O_cKCu39n6Ryc5l04SqTSSFmoVXQOl5vIKjQJcTwwGYzmtnFGohIW3mWBAT8aN312IytuVQ3MDFe03ky4dCH2KSSG0fM43GMuUFRyAOIf2jxtQ3qvmBNXDJ1aQTLnGHqTrimR8ez0IZv-CtGJeLYihWCRWwem49YtmWjscBOF0W5sYRBMjNQeefH1h2a3UZoh51Wiol_Fy_tytUmnTIH7EMj57QhfFlVZmpRngCdzS2ncHqCgsrHsXjPu5hP3NY6eYQAK06yqVIT0kOmF2Wnghc-BBOcoukfX2ba3ztg_NL86tR6Bx2G3wrfIb7nWzZUBSFhYkCdPVZzftvpKzXjkRV6tbdau-zWrzObzQXvGepmUsT4Ed1h5OxIPVS4xJcztZYVrPidr5EhvTf7wigT_l_qJ]--></g></svg>